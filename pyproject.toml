[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkling2-mlx"
version = "0.1.0"
description = "MLX runtime, converter and expert-pruning tool for Thinking Machines' Inkling 2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["mlx>=0.32", "numpy", "transformers", "huggingface_hub", "pillow"]

[project.optional-dependencies]
# the tests compare against the transformers reference, which needs a build that includes inkling2
test = ["torch", "torchvision", "safetensors"]

[tool.setuptools]
packages = ["inkling2_mlx"]
